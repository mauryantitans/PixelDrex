[project]
name = "pixeldrex"
version = "0.1.0"
description = "Every pixel is a decision: Drex paints and animates pixel-art GIFs."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "python-dotenv>=1.0", "pillow>=10.0"]

[project.scripts]
pixeldrex = "pixeldrex.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pixeldrex"]
